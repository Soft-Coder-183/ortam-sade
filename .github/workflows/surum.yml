# Sürüm paketi: "vX.Y.Z" etiketi gönderilince Windows paketi GitHub'ın kendi sunucusunda, depodaki koddan üretilir ve
# sürüm olarak yayımlanır. Paket elle yüklenmez; kimin, hangi commit'ten, hangi iş akışıyla ürettiği GitHub'ın imzalı
# kaynak kanıtıyla (build provenance) doğrulanabilir:
#   gh attestation verify OrtamSade-win-x64.zip --repo Soft-Coder-183/ortam-sade
# Yayımlanan dosyaların adı sürüm numarası taşımaz (OrtamSade-kurulum.exe, OrtamSade-win-x64.zip, EtuCep.apk): README'deki
# .../releases/latest/download/<ad> bağlantıları her zaman son sürümü indirir. Uygulamaların güncelleyicileri dosyayı adın
# sonuna göre bulur (-win-x64.zip, .apk), sürüm numarasını etiketten alır.
# Sürüm notu depodaki notlar/vX.Y.Z.md dosyasından gelir.
name: Sürüm paketi

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write        # sürümü oluşturmak ve paketi eklemek için
  id-token: write        # kaynak kanıtı imzası için
  attestations: write

jobs:
  paket:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'   # pakete giren Node.js (runtime/node.exe) bu sürüm

      - name: Bağımlılıklar (package-lock.json'daki sürümlerle)
        run: npm ci

      - name: Etiket package.json sürümüyle aynı mı
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Etiket $GITHUB_REF_NAME, package.json $v"; exit 1; fi
          test -f "notlar/$GITHUB_REF_NAME.md" || { echo "notlar/$GITHUB_REF_NAME.md yok"; exit 1; }

      - name: Sözdizimi denetimi
        shell: bash
        run: for f in server/*.mjs mobile/*.mjs mobile/shim/*.mjs public/app.js; do node --check "$f"; done

      - name: Paket
        run: npm run paketle

      - name: Windows kurulumu (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          $v = node -p "require('./package.json').version"
          & $iscc "/DSurum=$v" kurulum\OrtamSade.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Java (Android derlemesi)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android paketi (ETÜ Cep)
        shell: bash
        env:
          ETUCEP_KEY_B64: ${{ secrets.ETUCEP_KEY_B64 }}
          ETUCEP_KEY_PASSWORD: ${{ secrets.ETUCEP_KEY_PASSWORD }}
        run: |
          test -n "$ETUCEP_KEY_B64" || { echo "İmza anahtarı (ETUCEP_KEY_B64) tanımlı değil"; exit 1; }
          v="$(node -p "require('./package.json').version")"
          node scripts/mobil.mjs
          echo "$ETUCEP_KEY_B64" | base64 -d > "$RUNNER_TEMP/etucep.keystore"
          export ETUCEP_KEYSTORE="$RUNNER_TEMP/etucep.keystore"
          (cd mobile/android && sh ./gradlew :app:assembleRelease --console=plain)
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/EtuCep-$v.apk"
          rm -f "$RUNNER_TEMP/etucep.keystore"

      - name: Yayın dosyaları (sürüm numarasız adlar)
        shell: bash
        run: |
          mkdir -p dist/yayin
          cp dist/OrtamSade-*-kurulum.exe dist/yayin/OrtamSade-kurulum.exe
          cp dist/OrtamSade-*-win-x64.zip dist/yayin/OrtamSade-win-x64.zip
          cp dist/EtuCep-*.apk dist/yayin/EtuCep.apk

      - name: Kaynak kanıtı (provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/yayin/OrtamSade-kurulum.exe
            dist/yayin/OrtamSade-win-x64.zip
            dist/yayin/EtuCep.apk

      - name: Sürümü yayımla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=dist/yayin/OrtamSade-win-x64.zip
          apk=dist/yayin/EtuCep.apk
          exe=dist/yayin/OrtamSade-kurulum.exe
          v="${GITHUB_REF_NAME#v}"
          # Her sürümün notuna doğrulama komutu eklenir
          { cat "notlar/$GITHUB_REF_NAME.md"
            printf '\n## Doğrulama\n\nBu paket GitHub Actions'"'"'ta bu depodaki koddan üretildi. Kendin doğrulamak için:\n\n'
            printf '```\n'
            for f in "$exe" "$zip" "$apk"; do printf 'gh attestation verify %s --repo %s\n' "$(basename "$f")" "$GITHUB_REPOSITORY"; done
            printf '```\n'
          } > surum-notu.md
          gh release create "$GITHUB_REF_NAME" "$exe#Windows · kurulum dosyası, önerilen (Ortam Sade $v)" "$zip#Windows · kurulumsuz, açıp çalıştır (Ortam Sade $v)" "$apk#Android · ETÜ Cep telefon uygulaması ($v)" --title "Ortam Sade ${GITHUB_REF_NAME#v}" --notes-file surum-notu.md --verify-tag
          sha256sum "$exe" "$zip" "$apk" >> "$GITHUB_STEP_SUMMARY"
