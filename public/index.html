<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Tema: kayıtlı tercih (aydınlık/karanlık) ilk çizimden önce uygulanır; yoksa cihazın ayarı geçerli (otomatik).
    try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <title>Ortam Sade</title>
  <!-- Simge: TOBB ETÜ logosunun üç rengi (mavi, kırmızı, turuncu). Yazı tipi sistemin kendi yazı tipi: uygulama çevrimdışı da aynı görünür. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff'/%3E%3Crect x='7' y='7' width='5' height='18' rx='2' fill='%231b449c'/%3E%3Crect x='13.5' y='7' width='5' height='18' rx='2' fill='%23b21f28'/%3E%3Crect x='20' y='7' width='5' height='18' rx='2' fill='%23f08921'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main id="view"></main>
  <script src="app.js" type="module"></script>
</body>
</html>
